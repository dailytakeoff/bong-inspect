# Builds the mod on every push, then starts the game in a virtual screen,
# plays the animation and saves screenshots. Jar + screenshots go to the ci-out branch.
name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build mod
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E -A3 '(error:|e: |FAILURE|What went wrong)' build.log | head -400 > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg:0:60000}"
      - name: Install software OpenGL (Mesa llvmpipe) and a virtual screen
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -q --no-install-recommends \
            xvfb xauth mesa-utils libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libegl-mesa0 libvulkan1 mesa-vulkan-drivers
      - name: In-game screenshots
        id: shots
        continue-on-error: true
        timeout-minutes: 22
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_VIDEO_DRIVER: x11
        run: |
          set -o pipefail
          XARGS="-screen 0 1280x720x24 +extension GLX +render -noreset"
          xvfb-run -a -s "$XARGS" glxinfo -B 2>&1 | tee gametest.log || true
          timeout 20m xvfb-run -a -s "$XARGS" ./gradlew runClientGameTest --no-daemon 2>&1 | tee -a gametest.log
      - name: Report game errors as annotations
        if: always()
        run: |
          grep -E -B2 -A12 '(Exception|ERROR|FAILED|Caused by|KEYS:|SHOT at|CREEPER|OpenGL renderer|OpenGL core profile version|direct rendering|Loaded bong)' gametest.log 2>/dev/null | head -300 > gerrors.txt || true
          msg=$(sed -e 's/%/%25/g' gerrors.txt | awk '{printf "%s%%0A", $0}')
          [ -s gerrors.txt ] && echo "::warning title=Game log::${msg:0:60000}" || true
      - name: API dump (temporary)
        if: always()
        run: |
          JARS=$(find ~/.gradle/caches .gradle -name '*.jar' -path '*minecraft*' 2>/dev/null | grep -v -e sources -e fabric-api -e fabric-loader | sort -u)
          { echo "JARS:"; echo "$JARS"; } > api.txt
          CP=$(echo "$JARS" | tr '\n' ':')
          for j in $JARS; do unzip -l "$j" 2>/dev/null | grep -i -E 'entity/EntityType[^/]*\.class|/BuiltInRegistries\.class' ; done | sort -u >> api.txt
          for c in net.minecraft.world.entity.EntityTypes net.minecraft.core.registries.BuiltInRegistries; do
            echo "=== $c" >> api.txt
            javap -cp "$CP" "$c" 2>&1 | grep -i -E 'creeper|ENTITY_TYPE|class|error' >> api.txt || true
          done
          wc -l api.txt
      - name: Save jar and screenshots to the ci-out branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/out/screenshots
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          find . -path ./node_modules -prune -o -name '*.png' -path '*screenshots*' -print -exec cp {} /tmp/out/screenshots/ \; || true
          cp gametest.log /tmp/out/ 2>/dev/null || true
          cp api.txt /tmp/out/ 2>/dev/null || true
          # main's builds go to ci-out; other branches to ci-out-<branch>, so they don't overwrite main's jar
          BR=ci-out
          [ "${GITHUB_REF_NAME}" != main ] && BR="ci-out-${GITHUB_REF_NAME//\//-}"
          cd /tmp/out
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$BR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bong-inspect
          path: build/libs/*.jar
